# ==============================================================================
# NGINX LOAD BALANCER (`nginx.conf`) — PUERTO 8080 (ROUND-ROBIN 3 RÉPLICAS API)
# Clúster Híbrido "La Cava" — Nodo Guayaquil (Laptop)
# ==============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Pool Round-Robin hacia las 3 réplicas de `api_lacava` (Scale-Out Horizontal)
    upstream api_lacava_cluster {
        # Estrategia por defecto en Nginx: Round-Robin entre las 3 réplicas
        server api_lacava:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name _;

        # Enrutamiento de peticiones de Agentes IA y Frontend (GitHub Pages) hacia las 3 réplicas de la API
        # Preserva el Header obligatorio `X-Sede` (QUITO, QUITO_NOSQL, QUITO_PARALELA, GUAYAQUIL, GUAYAQUIL_DWH, CUENCA)
        location /api/ {
            proxy_pass http://api_lacava_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Sede $http_x_sede;
            add_header X-Load-Balancer "nginx_lb_round_robin_8080" always;
        }
    }
}
